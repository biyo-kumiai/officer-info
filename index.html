<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鳥取支部 役員紹介</title>
<style>
  :root {
    --ink: #2c2c2a;
    --sub: #6b6a63;
    --line: #e4e2d9;
    --bg: #eef1f4;
    --card: #ffffff;
    --accent: #5f5e5a;
    --accent-bg: #ececea;
    --warn: #854f0b;
    --warn-bg: #faeeda;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
  }
  header {
    text-align: center;
    padding: 3rem 1.5rem 2rem;
  }
  header .eyebrow {
    font-size: 13px;
    color: var(--sub);
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  header h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0;
  }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 1.25rem 4rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card .photo {
    height: 140px;
    background: #f1efe8;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b4b2a9;
    font-size: 13px;
  }
  .card .body {
    padding: 18px 20px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .badge {
    display: inline-block;
    background: var(--accent-bg);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    padding: 3px 12px;
    border-radius: 6px;
    margin-bottom: 10px;
    align-self: flex-start;
  }
  .badge.pending {
    background: var(--warn-bg);
    color: var(--warn);
  }
  .salon-name {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 8px;
  }
  .salon-sub {
    font-size: 13px;
    color: var(--sub);
    margin: 0 0 4px;
  }
  .salon-note {
    font-size: 13px;
    color: var(--warn);
    margin: 4px 0 8px;
  }
  .link {
    margin-top: auto;
    padding-top: 10px;
    font-size: 13px;
  }
  .link a {
    color: var(--accent);
    text-decoration: none;
  }
  .link a:hover { text-decoration: underline; }
  .sub-list {
    margin: 4px 0 8px;
    padding-left: 0;
    list-style: none;
  }
  .sub-list li {
    font-size: 13px;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--line);
  }
  .sub-list li:last-child { border-bottom: none; }
  .sub-list .s-name { font-weight: 700; font-size: 14px; }
  .sub-list .s-addr { color: var(--sub); }
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--sub);
    padding: 2rem 1rem 3rem;
  }
</style>
</head>
